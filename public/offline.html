<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Clash</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1a1a18; --muted: #6b6b66; --accent: #3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ececea; --muted: #a0a09a; --accent: #7b93ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
  h1 { font-size: 1.15rem; margin: .75rem 0 .25rem; }
  p { color: var(--muted); margin: .5rem 0; }
  button { margin-top: 1rem; font: inherit; padding: .5rem 1rem; border-radius: .5rem; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" width="48" height="48" alt="">
  <h1>You're offline</h1>
  <p>This page hasn't been opened on this device yet, so there's no saved copy.</p>
  <p>Rounds you've already opened still work offline, and edits you make are saved on this device and sent when you reconnect.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
